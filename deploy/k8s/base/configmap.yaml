apiVersion: v1
kind: ConfigMap
metadata:
  name: phenoscope-config
data:
  PHENOSCOPE_JOB_BACKEND: kubernetes
  PHENOSCOPE_K8S_NAMESPACE: phenoscope
  PHENOSCOPE_DATA_ROOT: s3://phenoscope-zarr
  PHENOSCOPE_DEFAULT_SEGMENTER: cellpose
  PHENOSCOPE_MODEL_DIR: /models
# Secrets (database URLs, Mongo URL) are provided out-of-band as Secret/phenoscope-env,
# e.g. via External Secrets Operator backed by AWS Secrets Manager.
