apiVersion: apps/v1
kind: Deployment
metadata:
  name: phenoscope-api
  labels: { app: phenoscope-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: phenoscope-api }
  template:
    metadata:
      labels: { app: phenoscope-api }
    spec:
      serviceAccountName: phenoscope-api
      nodeSelector:
        phenoscope/pool: cpu
      containers:
        - name: api
          image: ghcr.io/maxxrichard/phenoscope:latest
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: phenoscope-config }
            - secretRef: { name: phenoscope-env }
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { memory: 4Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
