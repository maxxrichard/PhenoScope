[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "phenoscope"
version = "0.4.0"
description = "Imaging AI platform for microscopy and digital pathology: segmentation, phenotypic profiling, multiplex registration and drift monitoring at scale."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxx Richard Rahman" }]
keywords = [
  "microscopy", "digital-pathology", "segmentation", "cell-painting",
  "phenotypic-profiling", "ome-zarr", "whole-slide-imaging", "bioimage-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "opencv-python-headless>=4.8",
  "tifffile>=2023.7",
  "zarr>=2.16,<3",
  "fsspec>=2023.6",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "monai>=1.3",
  "cellpose>=3.0",
  "segment-anything>=1.0",
  "timm>=0.9",
]
cloud = ["s3fs>=2023.6", "boto3>=1.34", "kubernetes>=29.0"]
postgres = ["psycopg[binary]>=3.1"]
mongo = ["pymongo>=4.6"]
wsi = ["openslide-python>=1.3", "openslide-bin>=4.0"]
viewer = ["napari[all]>=0.4.19", "magicgui>=0.8"]
pipelines = ["apache-airflow>=2.8", "apache-airflow-providers-cncf-kubernetes>=8.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
all = ["phenoscope[ml,cloud,postgres,mongo,wsi,viewer]"]

[project.scripts]
phenoscope = "phenoscope.cli:app"

[project.entry-points."napari.manifest"]
phenoscope = "phenoscope.viewer:napari.yaml"

[project.urls]
Homepage = "https://github.com/maxxrichard/PhenoScope"
Issues = "https://github.com/maxxrichard/PhenoScope/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/phenoscope"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: requires CUDA", "ml: requires the [ml] extra"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
